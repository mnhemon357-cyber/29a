name: Build 29A Android APK & Verify Certificates

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Certificates & Anti-Spyware CLI
        run: |
          chmod +x scripts/*.sh app/29a_guard.py
          ./scripts/verify.sh
          ./scripts/i.sh
          python3 app/29a_guard.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build 29A Android APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Publish APK to Website Downloads
        run: |
          mkdir -p docs/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk docs/downloads/29a-cyber-guardian-v2.1.apk
          git config user.name "Nazmul Hossain"
          git config user.email "secure@emonindustry.bd"
          git add docs/downloads/29a-cyber-guardian-v2.1.apk
          git commit -m "Build: Update 29a-cyber-guardian-v2.1.apk" || exit 0
          git push

      - name: Attach APK & Certificates to GitHub Release v2.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: 29A / Cyber Guardian® v2.1
          files: |
            docs/downloads/29a-cyber-guardian-v2.1.apk
            certs/cyber_guardian_root_ca.crt
            certs/cyber_guardian_root_ca.der
            certs/cyber_guardian_android_ca.crt
            certs/SHA256SUMS
